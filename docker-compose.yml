version: '3.8'

services:
  backend:
    container_name: piexplorer-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
    expose:
      - "5000"
    networks:
      - pi_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    container_name: piexplorer-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - pi_network

  reverse-proxy:
    container_name: piexplorer-reverse-proxy
    build:
      context: ./reverse-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # فقط دامنه، بدون https://
      DOMAIN_NAME: apppiexplorerrjk7732.pinet.com
    ports:
      - "80:80"
      # اگر SSL تنظیم نکرده‌ای، این را فعلاً حذف کن
      # - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - pi_network

networks:
  pi_network:
    driver: bridge
