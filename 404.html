<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pi EXPLORER</title>
    <script>
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      var base = "/";

      if (!hash) {
        window.location.replace(base + "#/" + path.replace(/^\/+/, "") + search);
      } else {
        window.location.replace(base + hash);
      }
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
