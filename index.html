<script>
  (function () {
    var requiredHost = 'tiraxturumuz1.github.io';
    var appUrl = 'https://tiraxturumuz1.github.io';

    var userAgent = navigator.userAgent || '';
    var isPiBrowser = /PiBrowser|Pi Browser|MinePi/i.test(userAgent);
    var isRequiredHost = window.location.hostname === requiredHost;

    var shouldBlock = isRequiredHost && !isPiBrowser;

    window.__PI_BROWSER_REQUIRED_BLOCKED__ = shouldBlock;

    if (!shouldBlock) {
      return;
    }

    var root = document.getElementById('root');

    if (!root) {
      return;
    }

    root.innerHTML = `
      <style>
        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          font-family: Arial, sans-serif;
          background:
            radial-gradient(circle at top, rgba(103, 58, 183, 0.45), transparent 35%),
            linear-gradient(135deg, #111827, #1f2937);
          color: #ffffff;
          min-height: 100vh;
        }

        .pi-browser-guard-page {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          text-align: center;
          direction: ltr;
        }

        .pi-browser-guard-box {
          width: 100%;
          max-width: 560px;
          background: rgba(17, 24, 39, 0.92);
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 24px;
          padding: 32px 24px;
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
          backdrop-filter: blur(10px);
        }

        .pi-browser-guard-logo {
          width: 76px;
          height: 76px;
          border-radius: 50%;
          margin: 0 auto 18px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #fbbf24, #a855f7);
          color: #111827;
          font-size: 34px;
          font-weight: 900;
        }

        .pi-browser-guard-box h1 {
          margin: 0 0 14px;
          font-size: 24px;
          line-height: 1.5;
          color: #ffffff;
        }

        .pi-browser-guard-box p {
          margin: 0 0 18px;
          color: #d1d5db;
          font-size: 15px;
          line-height: 1.9;
        }

        .pi-browser-guard-actions {
          margin-top: 24px;
          display: grid;
          gap: 12px;
        }

        .pi-browser-guard-button {
          display: block;
          width: 100%;
          border: 0;
          border-radius: 14px;
          padding: 14px 18px;
          font-size: 16px;
          font-weight: 700;
          text-decoration: none;
          cursor: pointer;
          transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .pi-browser-guard-button:hover {
          transform: translateY(-1px);
          opacity: 0.92;
        }

        .pi-browser-guard-primary {
          background: #fbbf24;
          color: #111827;
        }

        .pi-browser-guard-secondary {
          background: #374151;
          color: #ffffff;
        }

        .pi-browser-guard-note {
          margin-top: 16px;
          font-size: 13px;
          color: #9ca3af;
          line-height: 1.8;
        }
      </style>

      <main class="pi-browser-guard-page">
        <section class="pi-browser-guard-box">
          <div class="pi-browser-guard-logo">π</div>

          <h1>Open this app in Pi Browser</h1>

          <p>
            This app is built for Pi Network. Pi login, payments, and Pi features
            work only inside <strong>Pi Browser</strong>.
          </p>

          <div class="pi-browser-guard-actions">
            <button
              id="copyPiAppUrlButton"
              class="pi-browser-guard-button pi-browser-guard-primary"
              type="button"
            >
              Copy app address
            </button>

            <button
              id="manualPiBrowserButton"
              class="pi-browser-guard-button pi-browser-guard-secondary"
              type="button"
            >
              I will open Pi Browser manually
            </button>
          </div>

          <div class="pi-browser-guard-note" id="piBrowserNote">
            Tap “Copy app address”, then open Pi Browser and paste it there.
          </div>
        </section>
      </main>
    `;

    var copyButton = document.getElementById('copyPiAppUrlButton');
    var manualButton = document.getElementById('manualPiBrowserButton');
    var note = document.getElementById('piBrowserNote');

    function copyAppUrl() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard
          .writeText(appUrl)
          .then(function () {
            if (copyButton) {
              copyButton.textContent = 'App address copied';
            }

            if (note) {
              note.textContent =
                'Now open Pi Browser manually and paste the copied address.';
            }
          })
          .catch(function () {
            if (copyButton) {
              copyButton.textContent = 'Copy failed';
            }

            if (note) {
              note.textContent =
                'Copy failed. Please open Pi Browser manually and type the app address.';
            }
          });
      } else {
        if (copyButton) {
          copyButton.textContent = 'Copy not supported';
        }

        if (note) {
          note.textContent =
            'Please open Pi Browser manually and type the app address.';
        }
      }
    }

    if (copyButton) {
      copyButton.addEventListener('click', copyAppUrl);
    }

    if (manualButton) {
      manualButton.addEventListener('click', function () {
        if (note) {
          note.textContent =
            'Open Pi Browser manually, then paste the copied app address in the Pi Browser address bar.';
        }
      });
    }
  })();
</script>
